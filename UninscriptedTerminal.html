<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNINSCRIPTED TERMINAL</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #2ecc71; /* Bureaucratic Green */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-shadow: 0 0 5px #2ecc71;
        }

        .container {
            width: 80%;
            max-width: 500px;
            border: 1px solid #2ecc71;
            padding: 20px;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        header {
            border-bottom: 1px solid #2ecc71;
            margin-bottom: 20px;
            padding-bottom: 10px;
            font-size: 0.8em;
        }

        .input-area {
            display: flex;
            align-items: center;
        }

        span { margin-right: 10px; }

        input {
            background: transparent;
            border: none;
            color: #2ecc71;
            font-family: inherit;
            font-size: 1.2em;
            outline: none;
            width: 100%;
        }

        #message {
            margin-top: 20px;
            height: 1.2em;
            font-size: 0.9em;
        }

        .glitch {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        [ SYSTEM ADMINISTRATION - LATTICE ACCESS ]<br>
        SECURE NODE: 192.168.0.254<br>
        STATUS: WAITING_FOR_CREDENTIALS
    </header>

    <div class="input-area">
        <span>&gt;</span>
        <input type="text" id="codeField" maxlength="10" placeholder="ENTER_ID" autofocus autocomplete="off">
    </div>

    <div id="message"></div>
</div>

<script>
    const input = document.getElementById('codeField');
    const msg = document.getElementById('message');
    
    // The "Master Key" (Your Unix Timestamp)
    const VALID_CODE = "1230185934";
    // Replace this with your actual GitHub Repo URL
    const TARGET_URL = "https://github.com/Xalipan/TruVw-Browser";

    input.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') {
            const val = input.value.trim();

            if (val === VALID_CODE) {
                msg.innerHTML = "CREDENTIALS ACCEPTED. REDIRECTING...";
                msg.style.color = "#2ecc71";
                
                // Slight delay for dramatic effect
                setTimeout(() => {
                    window.location.href = TARGET_URL;
                }, 1500);
            } else {
                msg.innerHTML = "ERROR: INVALID_OBJECT_ID";
                msg.style.color = "#e74c3c"; // Warning Red
                input.value = "";
                
                setTimeout(() => { msg.innerHTML = ""; }, 2000);
            }
        }
    });
</script>

</body>
</html>
